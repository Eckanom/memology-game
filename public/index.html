<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memeology Ultimate</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div class="app-container">
        
        <div id="login-screen" class="screen active centered-screen">
            <div class="login-card">
                <h1>👾 Мемология</h1>
                <p class="subtitle">Ultimate Edition</p>
                <div class="input-group">
                    <input type="text" id="username" placeholder="Твой никнейм" maxlength="15">
                </div>
                <div class="input-group">
                    <input type="text" id="room" placeholder="Номер комнаты (напр. 101)" maxlength="10">
                </div>
                
                <div class="nsfw-toggle">
                    <label class="switch">
                        <input type="checkbox" id="nsfw-check">
                        <span class="slider round"></span>
                    </label>
                    <span class="nsfw-label">🔞 Режим 18+ (NSFW)</span>
                </div>

                <button class="btn-primary full-width" onclick="joinGame()">ВОЙТИ</button>
            </div>
        </div>

        <div id="lobby-screen" class="screen centered-screen">
            <div class="lobby-card">
                <div class="lobby-header">
                    <h2>Комната: <span id="room-display" class="highlight-purple">...</span></h2>
                    <span id="nsfw-badge" style="display:none; margin-left:10px; color:#ff4444; border:1px solid #ff4444; padding:2px 6px; border-radius:4px; font-size:0.8rem;">18+</span>
                </div>
                
                <div class="players-section">
                    <h3>Игроки онлайн:</h3>
                    <div id="player-list" class="players-list-modern"></div>
                </div>

                <div class="lobby-footer">
                    <p id="lobby-status-text">Нужно минимум 3 игрока...</p>
                    <button id="start-btn" class="btn-primary full-width" onclick="startGame()" style="display:none;">НАЧАТЬ ИГРУ</button>
                </div>
            </div>
        </div>

        <div id="game-screen" class="screen game-layout">
            
            <header class="game-header">
                <div class="header-left">
                    <div class="round-badge" id="round-display">Раунд 1/9</div>
                    <div class="role-badge" id="role-badge">Загрузка...</div>
                </div>
                <div class="score-panel" id="score-board">
                    Ожидание счета...
                </div>
            </header>

            <main class="game-main">
                <div class="scenario-card-modern">
                    <div class="card-header-purple">СИТУАЦИЯ</div>
                    <div class="card-body-white">
                        <p id="scenario-text">...</p>
                    </div>
                </div>

                <div class="table-area-modern">
                    <div class="table-status">
                        <span id="status-text">Загрузка...</span>
                    </div>
                    <div id="submissions-container" class="cards-row table-row"></div>
                </div>
            </main>

            <footer id="hand-area" class="hand-footer">
                <div class="hand-header">Твои мемы</div>
                <div id="my-hand" class="cards-row hand-row"></div>
            </footer>
        </div>

        <div id="gameover-screen" class="screen centered-screen">
            <div class="podium-card">
                <h1>👑 ИГРА ОКОНЧЕНА 👑</h1>
                <div class="podium-container" id="podium-list">
                    </div>
                <button class="btn-primary" onclick="location.reload()">В МЕНЮ</button>
            </div>
        </div>

    </div>

    <script src="client.js"></script>
</body>
</html>
