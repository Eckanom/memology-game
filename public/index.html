<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memeology Ultimate</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="app-container">
        
        <div id="login-screen" class="screen active">
            
            <div class="menu-panel">
                <span class="version-tag">v2.1</span>
                <div class="logo-area">
                    <h1>MEMEOLOGY</h1>
                    <span class="subtitle">ULTIMATE EDITION</span>
                </div>

                <div id="login-form">
                    <input type="text" id="username" class="input-retro" placeholder="ТВОЙ НИК" maxlength="15">
                    <input type="text" id="room" class="input-retro" placeholder="НОМЕР КОМНАТЫ" maxlength="10">
                    
                    <div class="nsfw-toggle-menu">
                        <input type="checkbox" id="nsfw-check">
                        <label for="nsfw-check">NSFW 18+</label>
                    </div>

                    <button class="retro-btn btn-start" onclick="joinGame()">ВОЙТИ В ИГРУ</button>
                    <button class="retro-btn btn-options" onclick="alert('Настройки звука скоро будут!')">ОПЦИИ</button>
                </div>
            </div>
        </div>

        <div id="lobby-screen" class="screen">
            <div class="lobby-card">
                <h2>ЛОББИ</h2>
                <div class="room-badge">
                    КОМНАТА: <span id="room-display">...</span>
                    <span id="nsfw-badge" style="display:none; color:red; margin-left:10px;">[18+]</span>
                </div>
                
                <div id="player-list" class="player-list-container"></div>

                <p id="lobby-status-text">ЖДЕМ ИГРОКОВ...</p>
                <button id="start-btn" class="retro-btn btn-market" onclick="startGame()" style="display:none;">НАЧАТЬ ИГРУ</button>
            </div>
        </div>

        <div id="game-screen" class="screen game-layout">
            
            <div class="game-header">
                <div>
                    <span class="round-tag">РАУНД <span id="round-display">1/9</span></span>
                    <span id="role-badge" style="font-weight:bold; margin-left:10px;">...</span>
                </div>
                <div id="score-board">СЧЕТ: 0</div>
            </div>

            <div class="scenario-card-modern">
                <div class="card-header-purple">СИТУАЦИЯ</div>
                <div class="card-body-white">
                    <p id="scenario-text">...</p>
                </div>
            </div>

            <div class="table-area">
                <div id="status-text">ЖДЕМ ХОДА...</div>
                <div id="submissions-container"></div>
            </div>

            <div id="hand-area">
                <div class="hand-label">ТВОИ КАРТЫ</div>
                <div id="my-hand"></div>
            </div>
        </div>

        <div id="gameover-screen" class="screen">
            <div class="lobby-card" style="background:var(--panel-yellow);">
                <h1 style="font-size:3rem;">ФИНАЛ</h1>
                <div id="podium-list" style="margin:20px 0; font-size:1.2rem; font-weight:bold;"></div>
                <button class="retro-btn btn-start" onclick="location.reload()">В МЕНЮ</button>
            </div>
        </div>

    </div>

    <script src="client.js"></script>
</body>
</html>
